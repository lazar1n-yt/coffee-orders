server {
  listen      80 default_server;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # Захисні заголовки (HSTS додається на edge / reverse-proxy)
  add_header X-Frame-Options          "DENY"               always;
  add_header X-Content-Type-Options   "nosniff"            always;
  add_header Referrer-Policy          "no-referrer"        always;
  add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin"      always;

  # gzip/br compression
  gzip                on;
  gzip_comp_level     6;
  gzip_min_length     1024;
  gzip_types          text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Healthcheck для Docker / k8s readiness
  location = /health {
    access_log  off;
    add_header  Content-Type text/plain;
    return      200 "ok\n";
  }

  # Статика з довгим кешем (Vite додає hash у назву файлу)
  location /assets/ {
    expires     1y;
    access_log  off;
    add_header  Cache-Control "public, immutable, max-age=31536000";
    try_files   $uri =404;
  }

  # SPA fallback: всі невідомі шляхи віддаємо index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 404 / 50x — теж SPA, нехай React Router обробляє
  error_page 404 /index.html;
}
