# Production-ready full-stack composition for Coffee Orders.
# Запуск: `docker compose up -d --build` (з кореня репозиторію).
# Для локальної розробки використовуйте `docker-compose.dev.yml`.

name: coffee-orders

services:
  db:
    image: postgres:18-alpine
    container_name: coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-coffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee}
      POSTGRES_DB:       ${POSTGRES_DB:-coffee_orders}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coffee} -d ${POSTGRES_DB:-coffee_orders}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт пробрасуємо лише в dev-режимі через override

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/lazar1n-yt/coffee-orders-backend:latest
    container_name: coffee-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV:            production
      PORT:                4000
      DATABASE_URL:        postgresql://${POSTGRES_USER:-coffee}:${POSTGRES_PASSWORD:-coffee}@db:5432/${POSTGRES_DB:-coffee_orders}?schema=public
      JWT_ACCESS_SECRET:   ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES:  ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      CORS_ORIGIN:         ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR:          /app/uploads
      PUBLIC_FILES_BASE_URL: ${PUBLIC_FILES_BASE_URL:-http://localhost:4000/files}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Coffee Orders <noreply@example.com>}
    volumes:
      - uploads_data:/app/uploads
    networks: [internal, web]
    expose: ['4000']
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    image: ghcr.io/lazar1n-yt/coffee-orders-frontend:latest
    container_name: coffee-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [web]
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  db_data:
  uploads_data:
