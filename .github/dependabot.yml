version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      backend-prod:
        dependency-type: production
        update-types: [minor, patch]
      backend-dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Kyiv
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]
